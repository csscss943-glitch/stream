.flip-scene{

}
.flip-inner{

.flip-inner.flipped{
  transform:rotateY(180deg);
}
.flip-face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  overflow:hidden;
}
.flip-back{
  transform:rotateY(180deg);
}
.board-mode .flip-inner{

}
